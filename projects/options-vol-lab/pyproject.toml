[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-vol-lab"
version = "0.1.0"
description = "Options pricing and volatility lab: BS/binomial/Monte Carlo pricers, Greeks, implied vol, and Heston calibration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gil Hermanns" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ovl-price = "options_vol_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
