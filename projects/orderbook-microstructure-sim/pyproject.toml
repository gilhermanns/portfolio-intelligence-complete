[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbook-sim"
version = "0.1.0"
description = "Event-driven limit order book simulator with liquidity-provider, momentum, and noise-trader agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gil Hermanns" }]
dependencies = [
    "sortedcontainers>=2.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
